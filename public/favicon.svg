<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- from-amber: hsl(38, 92%, 50%) = #f59e0b -->
      <!-- to-amber-glow: hsl(38, 100%, 60%) = #fbbf24 -->
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Rounded square background — matches rounded-lg amber gradient box -->
  <rect width="32" height="32" rx="7" fill="url(#amberGrad)" />
  <!-- "R" letter — matches text-sidebar (sidebar background ≈ dark navy) -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="20"
    fill="#0f172a"
  >R</text>
</svg>
