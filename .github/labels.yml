# ─── Type ────────────────────────────────────────────
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type: feature"
  color: "0075ca"
  description: "New feature or request"

- name: "type: task"
  color: "e4e669"
  description: "General task or chore"

- name: "type: refactor"
  color: "7057ff"
  description: "Code improvement without behavior change"

- name: "type: docs"
  color: "0052cc"
  description: "Documentation only"

# ─── Status ──────────────────────────────────────────
- name: "status: needs-triage"
  color: "ededed"
  description: "Needs review and categorization"

- name: "status: in-progress"
  color: "fbca04"
  description: "Currently being worked on"

- name: "status: blocked"
  color: "e11d48"
  description: "Blocked by external dependency"

- name: "status: ready-for-review"
  color: "0e8a16"
  description: "Ready for code review"

- name: "status: wont-fix"
  color: "ffffff"
  description: "This will not be worked on"

# ─── Priority ────────────────────────────────────────
- name: "priority: critical"
  color: "b60205"
  description: "Must fix immediately"

- name: "priority: high"
  color: "d93f0b"
  description: "Fix in current sprint"

- name: "priority: medium"
  color: "e4e669"
  description: "Fix in next sprint"

- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

